<body>
  <div id="site"><div class="shell" style="padding:80px 0;font-size:14px">Loading Opervia…</div></div>
  <script>
    let content, lang = localStorage.getItem('opervia-language') || 'en', filter = 'all';
    const $ = (s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];
    const esc = v => String(v ?? '').replace(/[&<>'"]/g, x => ({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]));
    const paras = text => esc(text).split(/\n\s*\n/).filter(Boolean).map(p=>`<p>${p.replace(/\n/g,'<br>')}</p>`).join('');
    const t = (object, field) => object?.[lang]?.[field] || object?.en?.[field] || '';
    const category = v => ({delivery:lang==='ka'?'მიწოდება':'Delivery',operations:lang==='ka'?'ოპერაციები':'Operations',ai:'AI enablement'})[v] || v;
    const labels = () => lang === 'ka' ? {all:'ყველა სტატია', service:'სერვისები', insights:'ინსაითები', faq:'FAQ', start:'დავიწყოთ საუბარი', explore:'იხილეთ სერვისი', read:'წაიკითხეთ →', back:'← მთავარ გვერდზე', outcomes:'რას მიიღებთ', diagnostics:'განვიხილოთ დიაგნოსტიკა', name:'სახელი', company:'კომპანია', email:'სამუშაო ელფოსტა', message:'რისი გაუმჯობესება გსურთ?', send:'გაგზავნეთ მოთხოვნა', rights:'ყველა უფლება დაცულია.', reply:'მადლობა — თქვენი ელფოსტის პროგრამა მზად არის.'} : {all:'All insights', service:'Services', insights:'Insights', faq:'FAQ', start:'Start a conversation', explore:'Explore service', read:'Read insight →', back:'← Back to home', outcomes:'What you will receive', diagnostics:'Discuss the diagnostic', name:'Name', company:'Company', email:'Work email', message:'What would you like to improve?', send:'Send enquiry', rights:'All rights reserved.', reply:'Thank you — your email app is ready to send the message.'};
    function header(){const b=content.brand, l=labels();return `<div class="notice">${esc(t(content.home,'notice'))}</div><header class="header"><nav class="nav shell"><a class="brand" href="#home"><span class="mark"></span>${esc(b.name)}</a><div class="links" id="links"><button data-jump="services">${esc(t(b,'navServices')||l.service)}</button><button data-jump="insights">${esc(t(b,'navInsights')||l.insights)}</button><button data-jump="faq">${esc(t(b,'navFaq')||l.faq)}</button></div><div class="langs"><button data-lang="en" class="${lang==='en'?'active':''}">EN</button><button data-lang="ka" class="${lang==='ka'?'active':''}">ქა</button></div><a class="button dark" href="#contact">${esc(t(b,'navCta')||l.start)}</a><button class="menu" id="menu" aria-label="Menu"><span></span></button></nav></header>`}
    function home(){const h=content.home, l=labels(), publishedServices=[...content.services].filter(s=>s.published).sort((a,b)=>a.sort-b.sort), publishedPosts=[...content.posts].filter(p=>p.published).sort((a,b)=>b.publishedAt.localeCompare(a.publishedAt));return `${header()}<main><section class="hero"><div class="shell hero-inner"><div class="hero-grid"><div><span class="eyebrow">${esc(t(h,'heroEyebrow'))}</span><h1>${esc(t(h,'heroTitle')).replace(' strategic advantage.',' <em>strategic advantage.</em>').replace(' სტრატეგიულ უპირატესობად.',' <em>სტრატეგიულ უპირატესობად.</em>')}</h1><p class="hero-copy">${esc(t(h,'heroCopy'))}</p><div class="hero-actions"><a class="button" style="color:#08090c;background:#fff" href="#contact">${esc(t(h,'heroCta'))} →</a><a class="button line" href="#diagnostic">${lang==='ka'?'იხილეთ Delivery Diagnostic':'Explore Delivery Diagnostic'}</a></div></div><div class="map"><div class="map-head"><span>${lang==='ka'?'ოპერაციული სისტემა · ხედვა':'OPERATING SYSTEM · VIEW'}</span><span class="map-live">${lang==='ka'?'სიგნალები აქტიურია':'SIGNALS ACTIVE'}</span></div><div class="nodes"><div class="node-col"><span class="node-label">${lang==='ka'?'საწყისი':'INPUT'}</span><div class="node"><strong>${lang==='ka'?'კომპანიის მიზნები':'Company goals'}</strong><span>${lang==='ka'?'საერთო კონტექსტი':'shared context'}</span></div><div class="node"><strong>${lang==='ka'?'მომხმარებლის მოთხოვნა':'Customer demand'}</strong><span>${lang==='ka'?'ინფორმირებული არჩევანი':'informed choices'}</span></div></div><div class="node-col"><span class="node-label">${lang==='ka'?'ნაკადი':'FLOW'}</span><div class="node primary"><strong>${lang==='ka'?'მკაფიო პრიორიტეტები':'Clear priorities'}</strong><span>${lang==='ka'?'გადაწყვეტილებისთვის მზად სამუშაო':'decision-ready work'}</span></div><div class="node"><strong>${lang==='ka'?'სანდო მიწოდება':'Reliable delivery'}</strong><span>${lang==='ka'?'ხილვადი პროგრესი':'visible progress'}</span></div></div></div><div class="stats"><div class="stat"><b>01</b><span>${lang==='ka'?'ერთი სანდო<br>წყარო':'ONE SOURCE<br>OF TRUTH'}</span></div><div class="stat"><b>↗</b><span>${lang==='ka'?'ჯანსაღი<br>ნაკადი':'HEALTHY<br>FLOW'}</span></div><div class="stat"><b>∞</b><span>${lang==='ka'?'სწავლის<br>ციკლები':'LEARNING<br>LOOPS'}</span></div></div></div></div><div class="hero-foot"><span class="scroll">${lang==='ka'?'გადადით ქვემოთ':'Scroll to explore'}</span><span>${lang==='ka'?'იმუშავეთ სიცხადით / მიაწოდეთ თავდაჯერებით':'OPERATE WITH CLARITY / DELIVER WITH CONFIDENCE'}</span></div></div></section><section class="section"><div class="shell"><div class="intro"><div><span class="eyebrow">${esc(t(h,'introEyebrow'))}</span><h2>${esc(t(h,'introTitle'))}</h2></div><p class="lead">${esc(t(h,'introCopy'))}</p></div><div class="outcomes">${content.outcomes.map((o,i)=>`<article class="outcome"><span class="count">0${i+1}</span><h3>${esc(t(o,'title'))}</h3><p>${esc(t(o,'copy'))}</p></article>`).join('')}</div></div></section><section class="section services" id="services"><div class="shell service-grid"><div class="service-intro"><span class="eyebrow">${lang==='ka'?'რით გეხმარებით':'How we help'}</span><h2>${lang==='ka'?'სწორი ჩარევა, სწორ სიღრმეზე.':'The right intervention, at the right depth.'}</h2><p class="lead">${lang==='ka'?'დაიწყეთ დღევანდელი გამოწვევით ან განავითარეთ მის უკან მდგომი ოპერაციული მოდელი.':'Start with an immediate challenge or evolve the operating model behind it.'}</p><a class="button" style="color:#08090c;background:#fff" href="#contact">${lang==='ka'?'გვითხარით რა გაიჭედა':'Tell us what is stuck'}</a></div><div class="service-list">${publishedServices.map((s,i)=>`<a class="service" href="#service/${encodeURIComponent(s.slug)}"><span class="service-no">0${i+1}</span><div><h3>${esc(t(s,'title'))}</h3><p>${esc(t(s,'summary'))}</p></div><span class="arrow">↗</span></a>`).join('')}</div></div></section><section class="diagnostic" id="diagnostic"><div class="shell diag-grid"><div class="diag-main"><span class="eyebrow">${esc(t(h,'diagnosticEyebrow'))}</span><h2>${esc(t(h,'diagnosticTitle'))}</h2><p class="lead">${esc(t(h,'diagnosticCopy'))}</p><a class="button blue" href="#contact">${l.diagnostics} →</a></div><div class="diag-side"><h3>${l.outcomes}</h3><div class="check">${lang==='ka'?'მიმდინარე Delivery სისტემის მკაფიო სურათი':'A clear picture of the current delivery system'}</div><div class="check">${lang==='ka'?'მაღალი გავლენის მქონე შესაძლებლობები':'High-leverage improvement opportunities'}</div><div class="check">${lang==='ka'?'პრაქტიკული 90-დღიანი რეკომენდაცია':'A practical 90-day recommendation'}</div></div></div></section><section class="section blog" id="insights"><div class="shell"><div class="blog-top"><div><span class="eyebrow">${lang==='ka'?'OPERVIA ინსაითები':'OPERVIA INSIGHTS'}</span><h2>${lang==='ka'?'ფიქრი იმ გუნდებისთვის, რომლებიც მომავალს ქმნიან.':'Thinking for teams building what is next.'}</h2></div></div><div class="filters"><button class="filter ${filter==='all'?'active':''}" data-filter="all">${l.all}</button><button class="filter ${filter==='delivery'?'active':''}" data-filter="delivery">${category('delivery')}</button><button class="filter ${filter==='operations'?'active':''}" data-filter="operations">${category('operations')}</button><button class="filter ${filter==='ai'?'active':''}" data-filter="ai">AI enablement</button></div><div class="posts">${cards(publishedPosts)}</div></div></section><section class="section"><div class="shell about"><div><span class="eyebrow">${esc(t(h,'approachEyebrow'))}</span><h2>${esc(t(h,'approachTitle'))}</h2><p class="lead">${esc(t(h,'approachCopy'))}</p></div><div class="principles"><article class="principle"><b>01</b><div><h3>${lang==='ka'?'დაიწყეთ რეალური პრობლემით':'Start with the real problem'}</h3><p>${lang==='ka'?'ჩვენ framework-ს არ ვყიდით. ვირჩევთ მეთოდს, რომელიც კონკრეტულ კონტექსტს შეესაბამება.':'We do not sell a framework. We choose the method that fits your specific context.'}</p></div></article><article class="principle"><b>02</b><div><h3>${lang==='ka'?'ცვლილება ადამიანურ ტემპში':'Change at a human pace'}</h3><p>${lang==='ka'?'ახალ პროცესს აზრი აქვს მხოლოდ მაშინ, როცა მისი გამოყენება ადამიანებისთვის ბუნებრივი ხდება.':'A new process only matters when the people using it can genuinely make it their own.'}</p></div></article><article class="principle"><b>03</b><div><h3>${lang==='ka'?'შეინარჩუნეთ სისტემის სიმარტივე':'Keep the system simple'}</h3><p>${lang==='ka'?'მიზანია ნაკლები, მაგრამ ნათელი პროცესი — და არა ადმინისტრირება ადმინისტრირებისთვის.':'The goal is less process, made clear — never administration for its own sake.'}</p></div></article></div></div></section><section class="section faq" id="faq"><div class="faq-intro"><span class="eyebrow">${lang==='ka'?'ხშირი კითხვები':'Frequently asked'}</span><h2>${lang==='ka'?'რამდენიმე სასარგებლო პასუხი.':'A few useful answers.'}</h2></div><div class="faq-list">${[...content.faqs].sort((a,b)=>a.sort-b.sort).map(f=>`<details><summary>${esc(t(f,'question'))}</summary><div class="answer">${esc(t(f,'answer'))}</div></details>`).join('')}</div></section>${contact()}</main>`}
    function cards(posts){const list=filter==='all'?posts:posts.filter(p=>p.category===filter);if(!list.length)return `<div class="empty">${lang==='ka'?'ამ კატეგორიაში ჯერ სტატია არ არის.':'There are no published insights in this category yet.'}</div>`;return list.slice(0,6).map(p=>`<a class="card" href="#post/${encodeURIComponent(p.slug)}"><div class="card-top"><span class="category">${esc(category(p.category))}</span><span class="read">${p.readMinutes} ${lang==='ka'?'წთ':'min read'}</span></div><h3>${esc(t(p,'title'))}</h3><p>${esc(t(p,'excerpt'))}</p><div class="card-foot"><span>${esc(p.author)} · ${formatDate(p.publishedAt)}</span><span class="round">↗</span></div></a>`).join('')}
    function contact(){const h=content.home,l=labels();return `<section class="contact" id="contact"><div class="shell"><div class="contact-grid"><div><span class="eyebrow">${esc(t(h,'contactEyebrow'))}</span><h2>${esc(t(h,'contactTitle'))}</h2><p class="contact-copy">${esc(t(h,'contactCopy'))}</p></div><form class="form" id="contact-form"><div class="field"><label>${l.name}</label><input name="name" required></div><div class="field"><label>${l.company}</label><input name="company" required></div><div class="field wide"><label>${l.email}</label><input name="email" type="email" required></div><div class="field wide"><label>${l.message}</label><textarea name="message" rows="3" required></textarea></div><button class="button" style="color:#08090c;background:#fff" type="submit">${l.send} →</button><p id="form-status" style="display:none;grid-column:1/-1;margin:0;color:#aac2ff;font-size:11px">${l.reply}</p></form></div><footer class="footer"><a class="brand" href="#home"><span class="mark"></span>${esc(content.brand.name)}</a><div class="footer-links"><a href="#services">${esc(t(content.brand,'navServices')||l.service)}</a><a href="#insights">${esc(t(content.brand,'navInsights')||l.insights)}</a><a href="#faq">FAQ</a></div><div class="footer-end">© ${new Date().getFullYear()} ${esc(content.brand.name)}. ${esc(t(content.brand,'footer')||l.rights)}</div></footer></div></section>`}
    function formatDate(date){return new Intl.DateTimeFormat(lang==='ka'?'ka-GE':'en-GB',{day:'2-digit',month:'short',year:'numeric'}).format(new Date(date+'T12:00:00'))}
    function detail(type,slug){const item=(type==='post'?content.posts:content.services).find(x=>x.slug===slug&&x.published);if(!item)return notFound();const isPost=type==='post', l=labels();return `${header()}<main class="view"><div class="shell"><a class="back" href="#home">${l.back}</a><div class="detail"><div><div class="detail-meta">${isPost?esc(category(item.category))+' · '+formatDate(item.publishedAt):l.service}</div><h1>${esc(t(item,'title'))}</h1></div><div class="detail-side">${item.image?`<img class="detail-image" src="${esc(item.image)}" alt="">`:''}<div class="body-copy">${paras(t(item,'body'))}</div>${!isPost?`<div class="outcome-box"><h3>${l.outcomes}</h3><ul>${String(t(item,'outcomes')).split('\n').filter(Boolean).map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}</div></div></div></main>${contact()}`}
    function notFound(){return `${header()}<main class="view"><div class="shell"><span class="eyebrow">404</span><h1 style="font-size:clamp(42px,7vw,80px);letter-spacing:-.07em">${lang==='ka'?'გვერდი ვერ მოიძებნა.':'This page was not found.'}</h1><a class="button blue" href="#home">${labels().back}</a></div></main>`}
    function render(){const route=decodeURIComponent(location.hash.slice(1)||'home'),parts=route.split('/'),sectionRoutes=['services','insights','faq','contact','diagnostic'];$('#site').innerHTML=parts[0]==='post'?detail('post',parts.slice(1).join('/')):parts[0]==='service'?detail('service',parts.slice(1).join('/')):home();document.title=content.meta[lang].title;document.querySelector('meta[name="description"]').content=content.meta[lang].description;bind();if(sectionRoutes.includes(parts[0]))setTimeout(()=>document.getElementById(parts[0])?.scrollIntoView({behavior:'smooth'}),0);else window.scrollTo({top:0,behavior:'instant'})}
    function bind(){$$('[data-lang]').forEach(b=>b.onclick=()=>{lang=b.dataset.lang;localStorage.setItem('opervia-language',lang);render()});$('#menu')?.addEventListener('click',()=>$('#links').classList.toggle('open'));$$('[data-jump]').forEach(b=>b.onclick=()=>{location.hash='#'+b.dataset.jump;setTimeout(()=>document.getElementById(b.dataset.jump)?.scrollIntoView({behavior:'smooth'}),0)});$$('[data-filter]').forEach(b=>b.onclick=()=>{filter=b.dataset.filter;render();setTimeout(()=>document.getElementById('insights')?.scrollIntoView({behavior:'smooth'}),0)});$('#contact-form')?.addEventListener('submit',e=>{e.preventDefault();const f=new FormData(e.currentTarget),subject=encodeURIComponent('Opervia enquiry — '+f.get('company')),body=encodeURIComponent(`Name: ${f.get('name')}\nCompany: ${f.get('company')}\nEmail: ${f.get('email')}\n\nMessage:\n${f.get('message')}`);$('#form-status').style.display='block';location.href=`mailto:${content.brand.email}?subject=${subject}&body=${body}`})}
    fetch('/api/content').then(r=>{if(!r.ok)throw Error();return r.json()}).then(data=>{content=data;window.addEventListener('hashchange',render);render()}).catch(()=>{$('#site').innerHTML='<div class="shell" style="padding:80px 0">Unable to load site content. Please start the CMS server.</div>'});
  </script>
</body>
</html>
