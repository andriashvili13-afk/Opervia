<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Opervia CMS</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=Noto+Sans+Georgian:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root{--ink:#0a0b0f;--navy:#091a3a;--blue:#174de8;--pale:#eaf0ff;--soft:#f5f7fa;--line:#dfe3ea;--grey:#667080;--sans:"DM Sans","Noto Sans Georgian",Arial,sans-serif;--mono:"DM Mono",monospace}*{box-sizing:border-box}body{margin:0;min-width:320px;color:var(--ink);background:var(--soft);font-family:var(--sans);-webkit-font-smoothing:antialiased}button,input,textarea,select{font:inherit}button{cursor:pointer}a{color:inherit;text-decoration:none}.app{display:grid;grid-template-columns:248px 1fr;min-height:100vh}.sidebar{position:sticky;top:0;display:flex;flex-direction:column;height:100vh;padding:28px 17px 18px;color:#fff;background:var(--navy)}.brand{display:flex;align-items:center;gap:9px;padding:0 9px;font-size:19px;font-weight:700;letter-spacing:-.05em}.mark{position:relative;width:19px;height:19px;border:5px solid #aac2ff;border-radius:50%}.mark:after{position:absolute;top:-5px;right:-5px;width:7px;height:7px;border-radius:50%;background:#fff;content:""}.admin-label{margin:6px 0 35px 38px;color:#9bb4ef;font:500 9px var(--mono);letter-spacing:.13em}.nav{display:grid;gap:3px}.nav button{display:flex;align-items:center;gap:11px;width:100%;padding:11px 10px;border:0;border-radius:4px;color:#bdc9e6;background:transparent;text-align:left;font-size:12px;font-weight:600}.nav button:before{width:17px;color:#8ba9f3;font:500 10px var(--mono);content:attr(data-no)}.nav button:hover,.nav button.active{color:#fff;background:rgba(255,255,255,.1)}.nav button.active:before{color:#fff}.side-bottom{margin-top:auto;padding:14px 9px 0;border-top:1px solid rgba(255,255,255,.16);color:#9fb1d7;font-size:10px;line-height:1.5}.side-bottom a{display:block;margin-top:8px;color:#fff;font-weight:700}.main{min-width:0}.topbar{position:sticky;top:0;z-index:9;display:flex;justify-content:space-between;align-items:center;height:73px;padding:0 42px;border-bottom:1px solid var(--line);background:rgba(245,247,250,.9);backdrop-filter:blur(13px)}.crumb{color:var(--grey);font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}.top-actions{display:flex;align-items:center;gap:10px}.saved{opacity:0;color:#52705f;font-size:11px;transition:.2s}.saved.show{opacity:1}.button{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:38px;padding:0 14px;border:1px solid transparent;border-radius:4px;font-size:11px;font-weight:700}.button.dark{color:#fff;background:var(--ink)}.button.dark:hover{background:var(--blue)}.button.line{border-color:#c3cad5;background:#fff}.button.line:hover{border-color:var(--blue);color:var(--blue)}.content{width:min(1120px,calc(100% - 84px));margin:0 auto;padding:56px 0 90px}.kicker{color:var(--blue);font:500 10px var(--mono);letter-spacing:.11em;text-transform:uppercase}.title{margin:12px 0 9px;font-size:38px;letter-spacing:-.065em}.intro{max-width:700px;margin:0;color:var(--grey);font-size:14px;line-height:1.65}.overview{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:37px}.metric{min-height:156px;padding:21px;border:1px solid var(--line);border-radius:6px;background:#fff}.metric:nth-child(2){color:#fff;border-color:var(--navy);background:var(--navy)}.metric b{display:block;margin-top:31px;font-size:34px;letter-spacing:-.07em}.metric span{color:var(--grey);font-size:11px}.metric:nth-child(2) span{color:#afbee0}.tip{display:flex;gap:14px;margin-top:15px;padding:21px;border:1px solid #cbd9ff;border-radius:6px;background:var(--pale);color:#365078;font-size:13px;line-height:1.6}.tip b{color:var(--blue)}.panel{margin-top:36px;border:1px solid var(--line);border-radius:7px;background:#fff}.panel-head{display:flex;justify-content:space-between;align-items:center;gap:20px;padding:19px 22px;border-bottom:1px solid var(--line)}.panel-head h2{margin:0;font-size:16px;letter-spacing:-.03em}.panel-head p{margin:4px 0 0;color:var(--grey);font-size:11px}.form{padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:19px}.field{display:grid;gap:7px}.field.wide{grid-column:1/-1}.field label{color:#45505e;font-size:11px;font-weight:700}.field .hint{margin-top:-3px;color:#84909f;font-size:10px}.field input,.field textarea,.field select{width:100%;padding:10px 11px;border:1px solid #cfd5de;border-radius:4px;outline:none;background:#fff;color:var(--ink);font-size:12px}.field textarea{min-height:98px;resize:vertical;line-height:1.55}.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(23,77,232,.09)}.language-head{display:flex;align-items:center;gap:9px;margin:29px 0 14px;padding-top:25px;border-top:1px solid var(--line);color:var(--blue);font:500 10px var(--mono);letter-spacing:.1em}.language-head:first-child{margin-top:0;padding-top:0;border:0}.section-label{margin:29px 0 14px;color:#4d5867;font:500 10px var(--mono);letter-spacing:.1em;text-transform:uppercase}.collection{display:grid;grid-template-columns:330px 1fr;min-height:530px}.collection-list{padding:12px;border-right:1px solid var(--line);background:#fbfcfd}.collection-list button{display:block;width:100%;padding:13px 12px;border:0;border-radius:4px;color:#444d5a;background:transparent;text-align:left}.collection-list button:hover,.collection-list button.active{background:var(--pale);color:#123baf}.collection-list b{display:block;font-size:12px}.collection-list small{display:block;margin-top:4px;color:#7f8997;font-size:10px}.collection-edit{padding:25px}.edit-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:23px}.edit-head h2{margin:0;font-size:18px;letter-spacing:-.04em}.danger{color:#bf2b2b;border-color:#edc6c6;background:#fff}.danger:hover{background:#fff2f2}.toggle{display:flex;align-items:center;gap:8px;margin-top:4px;color:#4d5764;font-size:12px}.toggle input{accent-color:var(--blue)}.image-row{display:grid;grid-template-columns:1fr auto;gap:8px}.upload{align-self:start;min-height:39px;padding:0 12px;border:1px solid #cfd5de;border-radius:4px;background:#fff;color:#354052;font-size:11px;font-weight:700}.image-preview{display:block;max-width:210px;max-height:120px;margin-top:9px;border-radius:4px;object-fit:cover}.empty-list{padding:24px;color:var(--grey);font-size:12px}.raw{width:100%;min-height:480px;padding:14px;border:1px solid #cfd5de;border-radius:4px;outline:0;color:#2e3745;background:#fbfcfd;font:11px/1.55 var(--mono);resize:vertical}.raw:focus{border-color:var(--blue)}.import-note{margin:0 0 16px;color:var(--grey);font-size:12px;line-height:1.6}.actions{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:22px;padding-top:21px;border-top:1px solid var(--line)}.alert{display:none;margin-top:16px;padding:11px 13px;border-radius:4px;font-size:12px}.alert.error{display:block;color:#9d2727;background:#fff1f1}.alert.ok{display:block;color:#216240;background:#edfff3}@media(max-width:850px){.app{grid-template-columns:1fr}.sidebar{position:static;height:auto;padding:16px}.admin-label,.side-bottom{display:none}.nav{display:flex;overflow-x:auto;margin-top:16px}.nav button{flex:0 0 auto;width:auto}.topbar{padding:0 20px}.content{width:min(100% - 34px,1120px);padding-top:38px}.collection{grid-template-columns:1fr}.collection-list{border-right:0;border-bottom:1px solid var(--line);display:flex;gap:4px;overflow-x:auto}.collection-list button{flex:0 0 190px}.overview{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.field.wide{grid-column:auto}}@media(max-width:520px){.overview{grid-template-columns:1fr}.topbar{height:62px}.top-actions .button.line{display:none}.title{font-size:31px}.collection-edit,.form{padding:18px}.actions{align-items:stretch;flex-direction:column}.image-row{grid-template-columns:1fr}.top-actions .button{padding:0 10px}}
  </style>
</head>
<body>
  <div id="app"><div style="padding:60px;font-family:Arial">Loading CMS…</div></div>
  <script>
    let data, tab = 'overview', selected = { services:null, posts:null, faqs:null };
    const $=(s,p=document)=>p.querySelector(s), $$=(s,p=document)=>[...p.querySelectorAll(s)];
    const esc=v=>String(v??'').replace(/[&<>'"]/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[x]));
    const id=()=>crypto.randomUUID ? crypto.randomUUID() : Math.random().toString(36).slice(2);
    const slugify=value=>value.toLowerCase().trim().replace(/[^a-z0-9\s-]/g,'').replace(/[\s-]+/g,'-').replace(/^-|-$/g,'') || 'untitled';
    function transFields(obj, fields, prefix){return ['en','ka'].map((lang,i)=>`<div class="language-head">${lang==='en'?'ENGLISH':'ქართული'}</div><div class="grid">${fields.map(f=>`<div class="field ${f.wide?'wide':''}"><label>${f.label}</label>${f.hint?`<span class="hint">${f.hint}</span>`:''}${f.type==='textarea'?`<textarea data-trans="${prefix}" data-lang="${lang}" data-key="${f.key}">${esc(obj?.[lang]?.[f.key]||'')}</textarea>`:`<input data-trans="${prefix}" data-lang="${lang}" data-key="${f.key}" value="${esc(obj?.[lang]?.[f.key]||'')}">`}</div>`).join('')}</div>`).join('')}
    function readTrans(prefix, target){$$(`[data-trans="${prefix}"]`).forEach(field=>{target[field.dataset.lang] ||= {};target[field.dataset.lang][field.dataset.key]=field.value.trim()})}
    function page(title, description, content){return `<div class="app"><aside class="sidebar"><a class="brand" href="/" target="_blank"><span class="mark"></span>opervia</a><div class="admin-label">CONTENT STUDIO</div><nav class="nav">${nav('overview','01','Overview')}${nav('home','02','Home page')}${nav('services','03','Services')}${nav('posts','04','Insights / blog')}${nav('faqs','05','FAQ')}${nav('brand','06','Brand & contact')}${nav('advanced','07','Import / export')}</nav><div class="side-bottom">Changes are saved to the live content file.<a href="/" target="_blank">Open public website ↗</a></div></aside><main class="main"><header class="topbar"><span class="crumb">Opervia CMS / ${esc(title)}</span><div class="top-actions"><span class="saved" id="saved">Saved</span><a class="button line" href="/" target="_blank">View website ↗</a><button class="button dark" id="save">Save changes</button></div></header><div class="content"><div class="kicker">CONTENT MANAGEMENT</div><h1 class="title">${esc(title)}</h1><p class="intro">${esc(description)}</p>${content}<div id="alert" class="alert"></div></div></main></div>`}
    function nav(key,no,label){return `<button class="${tab===key?'active':''}" data-tab="${key}" data-no="${no}">${label}</button>`}
    function overview(){return page('Overview','Your content operations at a glance.',`<div class="overview"><div class="metric"><span>Published services</span><b>${data.services.filter(x=>x.published).length}</b></div><div class="metric"><span>Published insights</span><b>${data.posts.filter(x=>x.published).length}</b></div><div class="metric"><span>FAQ answers</span><b>${data.faqs.length}</b></div></div><div class="panel"><div class="panel-head"><div><h2>What can be edited here?</h2><p>Everything that appears as website content is managed from this dashboard.</p></div></div><div class="form"><div class="tip"><b>01</b><span><strong>Home page</strong> controls the hero, diagnostic, point of view and contact copy in English and Georgian.</span></div><div class="tip"><b>02</b><span><strong>Services and Insights</strong> can be added, unpublished, reordered by number, edited in both languages, and opened as individual public pages.</span></div><div class="tip"><b>03</b><span><strong>Import / export</strong> provides a complete editable backup of all site content.</span></div></div></div>`) }
    function home(){const h=data.home;const fields=[{key:'notice',label:'Top notice'},{key:'heroEyebrow',label:'Hero eyebrow'},{key:'heroTitle',label:'Hero title',type:'textarea'},{key:'heroCopy',label:'Hero description',type:'textarea',wide:true},{key:'heroCta',label:'Hero button label'},{key:'introEyebrow',label:'Outcomes eyebrow'},{key:'introTitle',label:'Outcomes title',type:'textarea'},{key:'introCopy',label:'Outcomes description',type:'textarea',wide:true},{key:'diagnosticEyebrow',label:'Diagnostic eyebrow'},{key:'diagnosticTitle',label:'Diagnostic title'},{key:'diagnosticCopy',label:'Diagnostic description',type:'textarea',wide:true},{key:'approachEyebrow',label:'Approach eyebrow'},{key:'approachTitle',label:'Approach title',type:'textarea'},{key:'approachCopy',label:'Approach description',type:'textarea',wide:true},{key:'contactEyebrow',label:'Contact eyebrow'},{key:'contactTitle',label:'Contact title',type:'textarea'},{key:'contactCopy',label:'Contact description',type:'textarea',wide:true}];return page('Home page','Edit all copy blocks displayed on the main landing page.',`<div class="panel"><div class="panel-head"><div><h2>Page copy</h2><p>English is the default public language; Georgian is selected from the website header.</p></div></div><form class="form" id="home-form">${transFields(h,fields,'home')}</form></div>`) }
    function listButtons(type, items){if(!items.length)return '<p class="empty-list">No items yet.</p>';return items.map((item,i)=>{const primary=item.en?.title||item.en?.question||'Untitled';const sub=type==='posts'?item.publishedAt:type==='services'?item.slug:`Order ${item.sort||i+1}`;return `<button data-select="${type}" data-id="${esc(item.id)}" class="${selected[type]===item.id?'active':''}"><b>${esc(primary)}</b><small>${esc(sub)}</small></button>`}).join('')}
    function imageControl(value){return `<div class="field wide"><label>Cover image</label><span class="hint">Upload an image or paste an existing URL. Images are stored locally in public/uploads.</span><div class="image-row"><input data-image-url value="${esc(value||'')}" placeholder="https://… or /uploads/image.jpg"><input class="upload" type="file" accept="image/png,image/jpeg,image/webp,image/gif" data-upload></div>${value?`<img class="image-preview" src="${esc(value)}" alt="">`:''}</div>`}
    function collection(type){const config={services:{title:'Services',desc:'Create a service page, control its public visibility and maintain both language versions.',fields:[{key:'title',label:'Service title'},{key:'summary',label:'Card summary',type:'textarea',wide:true},{key:'body',label:'Service page content',type:'textarea',wide:true},{key:'outcomes',label:'Outcomes (one item per line)',type:'textarea',wide:true}]},posts:{title:'Insights / blog',desc:'Publish practical notes in both languages. Each entry automatically receives its own public page.',fields:[{key:'title',label:'Article title',type:'textarea',wide:true},{key:'excerpt',label:'Card excerpt',type:'textarea',wide:true},{key:'body',label:'Article body (paragraphs separated by a blank line)',type:'textarea',wide:true}]},faqs:{title:'FAQ',desc:'Maintain frequently asked questions and answers in English and Georgian.',fields:[{key:'question',label:'Question',type:'textarea',wide:true},{key:'answer',label:'Answer',type:'textarea',wide:true}]}}[type];const items=data[type];let active=items.find(x=>x.id===selected[type])||items[0];if(active)selected[type]=active.id;return page(config.title,config.desc,`<div class="panel"><div class="collection"><aside class="collection-list"><button class="button dark" data-add="${type}" style="margin:2px 0 10px;width:100%">+ Add ${type==='posts'?'insight':type.slice(0,-1)}</button>${listButtons(type,items)}</aside><div class="collection-edit">${active?editCollection(type,active,config.fields):'<p class="empty-list">Use the add button to create your first item.</p>'}</div></div></div>`) }
    function editCollection(type,item,fields){const name=type==='posts'?'insight':type.slice(0,-1);let system='';if(type==='services')system=`<div class="grid"><div class="field"><label>URL slug</label><input data-system="slug" value="${esc(item.slug||'')}"><span class="hint">Public URL: #service/${esc(item.slug||'slug')}</span></div><div class="field"><label>Display order</label><input data-system="sort" type="number" value="${Number(item.sort)||1}"></div></div>`;if(type==='posts')system=`<div class="grid"><div class="field"><label>URL slug</label><input data-system="slug" value="${esc(item.slug||'')}"></div><div class="field"><label>Category</label><select data-system="category"><option value="delivery" ${item.category==='delivery'?'selected':''}>Delivery</option><option value="operations" ${item.category==='operations'?'selected':''}>Operations</option><option value="ai" ${item.category==='ai'?'selected':''}>AI enablement</option></select></div><div class="field"><label>Publish date</label><input data-system="publishedAt" type="date" value="${esc(item.publishedAt||'')}"></div><div class="field"><label>Author</label><input data-system="author" value="${esc(item.author||'Opervia')}"></div><div class="field"><label>Estimated read time (minutes)</label><input data-system="readMinutes" type="number" min="1" value="${Number(item.readMinutes)||5}"></div></div>`;if(type==='faqs')system=`<div class="field"><label>Display order</label><input data-system="sort" type="number" value="${Number(item.sort)||1}"></div>`;return `<div class="edit-head"><div><h2>Edit ${name}</h2><label class="toggle">${type!=='faqs'?`<input type="checkbox" data-system="published" ${item.published?'checked':''}> Visible on public website`:''}</label></div><button class="button danger" data-delete="${type}" data-id="${esc(item.id)}">Delete</button></div>${system}${type!=='faqs'?imageControl(item.image):''}${transFields(item,fields,type+'-item')}`}
    function brand(){const metaFields=[{key:'title',label:'SEO page title'},{key:'description',label:'SEO description',type:'textarea',wide:true}];const navFields=[{key:'navServices',label:'Services label'},{key:'navInsights',label:'Insights label'},{key:'navFaq',label:'FAQ label'},{key:'navCta',label:'Contact button label'},{key:'footer',label:'Footer legal line'}];return page('Brand & contact','Maintain public brand details, contact destination, navigation labels and search metadata.',`<div class="panel"><div class="panel-head"><div><h2>Company information</h2><p>Use an email address you control; public contact forms open a draft addressed to it.</p></div></div><div class="form"><div class="grid"><div class="field"><label>Brand name</label><input data-brand="name" value="${esc(data.brand.name)}"></div><div class="field"><label>Contact email</label><input data-brand="email" type="email" value="${esc(data.brand.email)}"></div><div class="field wide"><label>LinkedIn URL</label><input data-brand="linkedIn" value="${esc(data.brand.linkedIn||'')}"></div></div><div class="section-label">Search metadata</div>${transFields(data.meta,metaFields,'meta')}<div class="section-label">Navigation & footer labels</div>${transFields(data.brand,navFields,'brand-copy')}</div></div>`) }
    function advanced(){return page('Import / export','Download a complete backup or make bulk changes to the full content structure.',`<div class="panel"><div class="panel-head"><div><h2>Complete content map</h2><p>Changing this replaces all website content after you save.</p></div><button class="button line" id="download">Download JSON</button></div><div class="form"><p class="import-note">Use this for a safe backup or advanced batch editing. The dashboard forms remain the simplest option for daily changes.</p><textarea class="raw" id="raw-content">${esc(JSON.stringify(data,null,2))}</textarea></div></div>`) }
    function render(){const out={overview,home,services:()=>collection('services'),posts:()=>collection('posts'),faqs:()=>collection('faqs'),brand,advanced}[tab]();$('#app').innerHTML=out;bind()}
    function bind(){$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#save').onclick=save;$$('[data-select]').forEach(b=>b.onclick=()=>{selected[b.dataset.select]=b.dataset.id;render()});$$('[data-add]').forEach(b=>b.onclick=()=>add(b.dataset.add));$$('[data-delete]').forEach(b=>b.onclick=()=>remove(b.dataset.delete,b.dataset.id));$$('[data-upload]').forEach(b=>b.onchange=upload);$('#download')?.addEventListener('click',download)}
    function collect(){if(tab==='home')readTrans('home',data.home);if(tab==='brand'){data.brand.name=$('[data-brand="name"]').value.trim();data.brand.email=$('[data-brand="email"]').value.trim();data.brand.linkedIn=$('[data-brand="linkedIn"]').value.trim();readTrans('meta',data.meta);readTrans('brand-copy',data.brand)}if(['services','posts','faqs'].includes(tab)){const item=data[tab].find(x=>x.id===selected[tab]);if(!item)return;$$('[data-system]').forEach(f=>{let value=f.type==='checkbox'?f.checked:f.value.trim();if(['sort','readMinutes'].includes(f.dataset.system))value=Number(value)||1;item[f.dataset.system]=value});const image=$('[data-image-url]');if(image)item.image=image.value.trim();readTrans(tab+'-item',item)}if(tab==='advanced'){try{const next=JSON.parse($('#raw-content').value);if(!next||typeof next!=='object')throw Error();data=next}catch{throw Error('The JSON is not valid. Fix it before saving.')}}}
    async function save(){try{collect();const response=await fetch('/api/admin/content',{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({content:data})});const result=await response.json();if(!response.ok)throw Error(result.error||'Could not save');const saved=$('#saved');saved.classList.add('show');setTimeout(()=>saved.classList.remove('show'),1800);if(tab==='advanced')render()}catch(error){alertMessage(error.message||'Could not save changes.',true)}}
    function add(type){const common={id:id(),en:{},ka:{}};let item;if(type==='services')item={...common,slug:'new-service',sort:data.services.length+1,published:false,image:'',en:{title:'New service',summary:'',body:'',outcomes:''},ka:{title:'ახალი სერვისი',summary:'',body:'',outcomes:''}};if(type==='posts')item={...common,slug:'new-insight',category:'operations',published:false,publishedAt:new Date().toISOString().slice(0,10),author:data.brand.name,readMinutes:5,image:'',en:{title:'New insight',excerpt:'',body:''},ka:{title:'ახალი სტატია',excerpt:'',body:''}};if(type==='faqs')item={...common,sort:data.faqs.length+1,en:{question:'New question',answer:''},ka:{question:'ახალი კითხვა',answer:''}};data[type].push(item);selected[type]=item.id;tab=type;render()}
    function remove(type,itemId){if(!confirm('Delete this item? This cannot be undone after saving.'))return;data[type]=data[type].filter(x=>x.id!==itemId);selected[type]=null;render()}
    async function upload(event){const file=event.target.files?.[0];if(!file)return;if(file.size>3*1024*1024)return alertMessage('Choose an image under 3 MB.',true);const reader=new FileReader();reader.onload=async()=>{try{const response=await fetch('/api/admin/upload',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({filename:file.name,dataUrl:reader.result})});const result=await response.json();if(!response.ok)throw Error(result.error||'Upload failed');const input=$('[data-image-url]');input.value=result.url;alertMessage('Image uploaded. Save changes to attach it to this item.',false)}catch(error){alertMessage(error.message,true)}};reader.readAsDataURL(file)}
    function download(){const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='opervia-content-backup.json';link.click();URL.revokeObjectURL(url)}
    function alertMessage(message,error){const box=$('#alert');box.textContent=message;box.className='alert '+(error?'error':'ok');setTimeout(()=>{if(box)box.className='alert'},3600)}
    fetch('/api/admin/content').then(r=>{if(!r.ok)throw Error('Could not load CMS content.');return r.json()}).then(x=>{data=x;render()}).catch(error=>{$('#app').innerHTML=`<div style="padding:50px;font-family:Arial">${esc(error.message)}</div>`});
  </script>
</body>
</html>
